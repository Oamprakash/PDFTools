org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8
android.useAndroidX=true
kotlin.code.style=official
android.nonTransitiveRClass=true

# ── Ads ────────────────────────────────────────────────────────────────
# true  → release builds show Google TEST ads (use for internal / closed testing)
# false → release builds show your REAL AdMob ads (set before the production upload)
# Debug builds always show test ads. Works from Android Studio's "Generate Signed Bundle" too.
testAds=true

# R8 "full mode" strips classes that libraries load by reflection (ML Kit's component registry);
# compatibility mode keeps them. Costs a few hundred KB of app size at most.
android.enableR8.fullMode=false
