<svg xmlns="http://www.w3.org/2000/svg" width="1024" height="500" viewBox="0 0 1024 500">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#3563F0"/><stop offset="1" stop-color="#2449C7"/>
    </linearGradient>
    <filter id="sh" x="-20%" y="-20%" width="140%" height="150%"><feDropShadow dx="0" dy="10" stdDeviation="14" flood-color="#0A1C5C" flood-opacity="0.35"/></filter>
  </defs>
  <rect width="1024" height="500" fill="url(#bg)"/>
  <circle cx="930" cy="-40" r="220" fill="#FFFFFF" opacity="0.06"/>
  <circle cx="60" cy="520" r="200" fill="#FFFFFF" opacity="0.05"/>

  <!-- App icon tile -->
  <g transform="translate(96,96)" filter="url(#sh)">
    <rect width="132" height="132" rx="30" fill="#2F5BEA" stroke="#FFFFFF" stroke-opacity="0.25" stroke-width="2"/>
    <g transform="translate(66,66) scale(1.6) translate(-54,-54)">
      <path d="M38,32 a3,3 0 0 1 3,-3 H61 L72,40 V76 a3,3 0 0 1 -3,3 H41 a3,3 0 0 1 -3,-3 Z" fill="#FFFFFF"/>
      <path d="M61,29 V37 a3,3 0 0 0 3,3 H72 Z" fill="#FF7A59"/>
      <rect x="44" y="48" width="22" height="4" rx="2" fill="#2F5BEA"/>
      <rect x="44" y="56" width="22" height="4" rx="2" fill="#2F5BEA"/>
      <rect x="44" y="64" width="13" height="4" rx="2" fill="#2F5BEA"/>
    </g>
  </g>

  <!-- Name + promise -->
  <text x="96" y="318" font-family="Inter Display" font-weight="800" font-size="76" fill="#FFFFFF" letter-spacing="-1">PDFzy</text>
  <text x="96" y="366" font-family="Inter" font-weight="600" font-size="30" fill="#FFFFFF" opacity="0.95">Compress · Scan · Merge</text>
  <g transform="translate(96,394)">
    <rect width="318" height="42" rx="21" fill="#FFFFFF" opacity="0.16"/>
    <g transform="translate(18,11)" fill="none" stroke="#FFFFFF" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
      <rect x="1" y="8" width="16" height="12" rx="2.5"/><path d="M4.5,8 V5.5 a4.5,4.5 0 0 1 9,0 V8"/>
    </g>
    <text x="48" y="28" font-family="Inter" font-weight="600" font-size="19" fill="#FFFFFF">Files never leave your phone</text>
  </g>

  <!-- Result card: the hero feature -->
  <g transform="translate(566,108)" filter="url(#sh)">
    <rect width="366" height="284" rx="24" fill="#FFFFFF"/>
    <text x="28" y="50" font-family="Inter" font-weight="600" font-size="18" fill="#5A6272">Compress to exact size</text>
    <g transform="translate(28,72)">
      <rect width="104" height="40" rx="20" fill="#F0F2F7"/><text x="52" y="27" text-anchor="middle" font-family="Inter" font-weight="600" font-size="17" fill="#5A6272">100 KB</text>
      <rect x="114" width="104" height="40" rx="20" fill="#2F5BEA"/><text x="166" y="27" text-anchor="middle" font-family="Inter" font-weight="700" font-size="17" fill="#FFFFFF">200 KB</text>
      <rect x="228" width="56" height="40" rx="20" fill="#F0F2F7"/><text x="256" y="27" text-anchor="middle" font-family="Inter" font-weight="600" font-size="17" fill="#5A6272">1 MB</text>
    </g>
    <text x="28" y="172" font-family="Inter Display" font-weight="700" font-size="36" fill="#1B2333">4.8 MB <tspan fill="#E8710A">→</tspan> 190 KB</text>
    <g transform="translate(28,206)">
      <rect width="310" height="50" rx="14" fill="#E6F6EF"/>
      <circle cx="26" cy="25" r="12" fill="#0E9F6E"/>
      <path d="M20,25 l4,4 l8,-9" fill="none" stroke="#FFFFFF" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"/>
      <text x="48" y="32" font-family="Inter" font-weight="600" font-size="16" fill="#0B6B4A">Under 200 KB · ready to upload</text>
    </g>
  </g>
</svg>
